<style>
    html { background: none; overflow: hidden; }

    #particles-container { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; opacity: 0.5; }

    .container { display: flex; align-items: center; }

    button {
        backdrop-filter: blur(10px);
        background: color-mix(in srgb, var(--bg-2) 30%, transparent 70%);
        box-shadow: 0 0 0 .5px rgba(255,255,255,0.15), 0 16px 32px rgba(0,0,0,0.12);
        color: white; padding: 10px 20px; border: none; border-radius: 20px;
        font-size: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 2px; position: relative;
    }
    button:hover { scale: 1.05; background: var(--bg-3); }
    button:active { scale: .95; }
    button.disabled, button:disabled { filter: brightness(0.5); cursor: not-allowed; pointer-events: none; }
    button.active-btn {
        background: color-mix(in srgb, var(--accent) 40%, transparent 60%);
        box-shadow: 0 0 0 1px var(--accent), 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent 60%);
    }

    input {
        border-radius: 22px;
        background: color-mix(in srgb, var(--bg) 75%, transparent 25%);
        padding: 10px 20px; outline: none; backdrop-filter: blur(10px);
        width: 480px; color: var(--text); border: none; font-size: 16px;
    }
    input::placeholder { color: color-mix(in srgb, var(--text) 50%, transparent 50%); }
    input:focus { background: color-mix(in srgb, var(--bg-2) 60%, transparent 40%); }

    .messages-container {
        height: 80vh; bottom: 90px; width: 50%; overflow-y: auto; overflow-x: hidden;
        left: 50%; transform: translateX(-50%); position: absolute;
        padding: 10px; display: flex; flex-direction: column; align-items: flex-end;
    }

    .my-message {
        background: color-mix(in srgb, var(--bg-2) 75%, transparent 25%);
        padding: 15px; box-shadow: 0 0 0 2px rgba(255,255,255,0.10), 0 16px 32px rgba(0,0,0,0.12);
        border-radius: 20px 20px 10px 20px; max-width: 400px; position: relative; margin-bottom: 4px; right: 0;
    }

    .ai-message {
        background: color-mix(in srgb, var(--bg) 75%, transparent 25%);
        padding: 15px; box-shadow: 0 0 0 2px rgba(255,255,255,0.05), 0 16px 32px rgba(0,0,0,0.12);
        border-radius: 20px 20px 20px 10px; margin-bottom: 4px; max-width: 400px;
        position: relative; left: 0; align-self: flex-start; overflow-wrap: break-word; word-break: break-word;
    }

    .ai-message pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .ai-message code { font-family: 'Courier New', monospace; font-size: 0.9em; }
    .ai-message pre code { background: none; padding: 0; }
    .ai-message p { margin: 8px 0; }

    .msg-actions {
        display: flex; gap: 6px; margin-top: 6px; align-self: flex-start;
        margin-bottom: 14px;
    }

    .msg-actions button {
        font-size: 12px; padding: 4px 10px; border-radius: 10px;
        background: rgba(255,255,255,0.07); box-shadow: none; margin: 0; font-weight: normal;
    }

    .screenshot-preview { max-width: 100%; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }

    svg.loading { width: 1.25em; transform-origin: center; animation: rotate4 1.2s linear infinite; position: absolute; top: 5px; left: 5px; }
    .loading circle { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 1,200; stroke-dashoffset: 0; stroke-linecap: round; animation: dash4 1.5s ease-in-out infinite; }
    @keyframes rotate4 { 100% { transform: rotate(360deg); } }
    @keyframes dash4 {
        0% { stroke-dasharray: 1,200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90,200; stroke-dashoffset: -35px; }
        100% { stroke-dashoffset: -125px; }
    }

    #screen-preview-bar {
        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
        background: color-mix(in srgb, var(--bg-2) 80%, transparent 20%);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 8px 24px rgba(0,0,0,0.3);
        border-radius: 16px; padding: 10px 16px; display: none;
        align-items: center; gap: 12px; z-index: 100; font-size: 14px; color: var(--text);
    }
    #screen-preview-bar img { height: 50px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
    #screen-preview-bar .stop-btn { font-size: 14px; padding: 6px 12px; border-radius: 10px; background: rgba(255,80,80,0.25); color: #ff6b6b; }
    #screen-preview-bar .snap-btn { font-size: 14px; padding: 6px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 30%, transparent 70%); }

    /* history modal */
    #history-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        z-index: 200; align-items: center; justify-content: center;
    }
    #history-overlay.open { display: flex; }
    #history-modal {
        background: color-mix(in srgb, var(--bg-2) 97%, transparent 3%);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px; width: min(420px, 90vw); max-height: 70vh;
        display: flex; flex-direction: column;
        box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        overflow: hidden;
    }
    #history-modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);
        font-size: 14px; font-weight: 600;
    }
    #history-modal-header button {
        font-size: 16px; padding: 4px 8px; border-radius: 8px;
        background: rgba(255,255,255,0.07); box-shadow: none; margin: 0;
    }
    #history-list {
        flex: 1; overflow-y: auto; padding: 12px;
    }
    .history-item {
        padding: 12px 14px; border-radius: 12px; cursor: pointer; font-size: 13px;
        background: rgba(255,255,255,0.04); margin-bottom: 6px; transition: 0.15s;
        border: 1px solid rgba(255,255,255,0.06);
    }
    .history-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.12); }
    .history-item .hist-preview { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .hist-time { font-size: 10px; opacity: 0.4; margin-top: 3px; }
    .history-empty { text-align: center; opacity: 0.4; font-size: 13px; padding: 24px; }
    #history-modal-footer {
        display: flex; gap: 8px; padding: 12px 16px;
        border-top: 1px solid rgba(255,255,255,0.07);
    }
    #history-modal-footer button {
        font-size: 13px; padding: 8px 14px; border-radius: 12px;
        box-shadow: none; margin: 0; font-weight: normal;
    }

    /* mood selector */
    .mood-option {
        padding: 10px 14px; cursor: pointer; transition: 0.15s; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .mood-option:last-child { border-bottom: none; }
    .mood-option:hover { background: rgba(255,255,255,0.06); }
    .mood-option.active {
        background: color-mix(in srgb, var(--accent) 20%, transparent 80%);
        border-left: 3px solid var(--accent);
    }

    /* history toggle btn */
    #history-toggle {
        position: fixed; left: 12px; top: 12px; font-size: 18px; padding: 8px 12px;
        border-radius: 12px; z-index: 201;
    }

    ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2000px; }
    ::-webkit-scrollbar { background: var(--bg); width: 6px; border-radius: 3842px; }
</style>

<script>
    const input = document.getElementById("chat-input");
    const messagesContainer = document.getElementById("messages");

    const placeholders = ["Ask mochii AI...", "What's 2 + 2?", "How do I make a steak?", "What can you do?", "Explain this code...", "What's on my screen?"];
    input.placeholder = placeholders[Math.floor(Math.random() * placeholders.length)];

    // ── state ─────────────────────────────────────────────────────────────
let history = [];
let responseType = "text";
let pendingSnapshot = null;
let pendingUserImage = null;
let screenStream = null;
let thumbInterval = null;
let autoSnapOn = false;
let autoSnapInterval = null;
let mood = "casual";
    let currentChatId = Date.now().toString();
    let snapOnSend = true;
    let lastUserText = "";
    let lastUserSnap = null;

    // ── mood ──────────────────────────────────────────────────────────────
    const moodPrompts = {
        casual: "You are mochii ai, a friendly and casual AI assistant built into the mochii platform. Be warm, helpful, and conversational. Use simple language.",
        professional: "You are mochii ai, a professional AI assistant built into the mochii platform. Be precise, clear, and thorough in your responses.",
        concise: "You are mochii ai, an AI assistant built into the mochii platform. Be extremely concise. Give short, direct answers. No fluff.",
        school: "You are mochii ai helping a student. Give ONLY the direct answer or solution. No explanations, no steps, no context unless asked. Format cleanly and simply."
    };
    const moodDescriptions = {
        casual: "Friendly and conversational, like chatting with a friend.",
        professional: "Precise and thorough, formal tone.",
        concise: "Short direct answers only, no fluff.",
        school: "Just the answer, no explanation. Clean and simple."
    };

    function setMood(m) {
        mood = m;
        document.querySelectorAll(".mood-option").forEach(b => b.classList.remove("active"));
        const opt = document.getElementById("mopt-" + m);
        if (opt) opt.classList.add("active");
        const label = document.getElementById("mood-label");
        if (label) label.textContent = m;
        localStorage.setItem("mochii_mood", m);
        document.getElementById("mood-menu").style.display = "none";
    }

    function toggleMoodMenu() {
        const menu = document.getElementById("mood-menu");
        menu.style.display = menu.style.display === "none" ? "block" : "none";
    }

    // close mood menu when clicking outside
    document.addEventListener("click", e => {
        if (!e.target.closest("#mood-menu") && !e.target.closest("#mood-toggle-btn")) {
            const menu = document.getElementById("mood-menu");
            if (menu) menu.style.display = "none";
        }
    });

    function getSystemMessage() {
        return { role: "system", content: moodPrompts[mood] };
    }

    // ── render ────────────────────────────────────────────────────────────
    function renderContent(container, markdown) {
        let processed = markdown
            .replace(/\\\[/g, '$$').replace(/\\\]/g, '$$')
            .replace(/\\\(/g, '$').replace(/\\\)/g, '$');
        container.innerHTML = marked.parse(processed);
        container.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
        renderMathInElement(container, {
            delimiters: [{ left:"$$",right:"$$",display:true },{ left:"$",right:"$",display:false }],
            throwOnError: false
        });
    }

    function scrollBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }

    function addUserMessage(text, imgBase64) {
        const div = document.createElement("div");
        div.classList.add("my-message");
        if (imgBase64) {
            const img = document.createElement("img");
            img.src = "data:image/jpeg;base64," + imgBase64;
            img.classList.add("screenshot-preview");
            div.appendChild(img);
        }
        const p = document.createElement("p");
        p.style.margin = "4px 0 0 0";
        p.textContent = text;
        div.appendChild(p);
        messagesContainer.appendChild(div);
        scrollBottom();
    }

    function clearImagePreview() {
    pendingUserImage = null;
    const imgPreviewBar = document.getElementById('image-preview-bar');
    const imgThumb = document.getElementById('image-thumb');
    if (imgPreviewBar) imgPreviewBar.style.display = 'none';
    if (imgThumb) imgThumb.src = '';
    updateSnapIndicator();
}

    function addLoadingMessage() {
        const div = document.createElement("div");
        div.classList.add("ai-message");
        div.innerHTML = `<svg viewBox="25 25 50 50" class="loading"><circle r="20" cy="50" cx="50"></circle></svg>`;
        messagesContainer.appendChild(div);
        scrollBottom();
        return div;
    }

function addAIMessage(text, loadingDiv) {
    if (loadingDiv) {
        loadingDiv.innerHTML = "";
        renderContent(loadingDiv, text);
    }
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    actions.innerHTML = `
        <button onclick="copyMsg(this)" title="Copy">
            <i class="ri-clipboard-line"></i> copy
        </button>

        <button onclick="regenMsg()" title="Regenerate">
            <i class="ri-refresh-line"></i> regen
        </button>

        <button onclick="deleteMsg(this)" title="Delete">
            <i class="ri-delete-bin-line"></i> delete
        </button>
    `;
    loadingDiv.insertAdjacentElement("afterend", actions);
    scrollBottom();
}

function deleteMsg(btn) {
    const actions = btn.closest(".msg-actions");
    const msg = actions.previousElementSibling;

    if (msg) {
        msg.remove();
    }

    actions.remove();
}

    function copyMsg(btn) {
        const msg = btn.closest(".msg-actions").previousElementSibling;
        navigator.clipboard.writeText(msg.innerText);
        btn.innerHTML = '<i class="ri-check-line"></i> copied';
        setTimeout(() => btn.innerHTML = '<i class="ri-clipboard-line"></i> copy', 2000);
    }

async function regenMsg() {
    if (!lastUserText) return;
    const allActions = messagesContainer.querySelectorAll(".msg-actions");
    if (allActions.length > 0) {
        const lastActions = allActions[allActions.length - 1];
        const lastMsg = lastActions.previousElementSibling;
        if (lastMsg) {
            lastMsg.remove();
        }
        lastActions.remove();
    }
    if (
        history.length > 0 &&
        history[history.length - 1].role === "assistant"
    ) {
        history.pop();
    }
    if (
        history.length > 0 &&
        history[history.length - 1].role === "user"
    ) {
        history.pop();
    }
    await askAI(lastUserText, lastUserSnap);
}

    // ── AI call ───────────────────────────────────────────────────────────
    async function askAI(userText, imgBase64) {
        lastUserText = userText;
        lastUserSnap = imgBase64;

        const content = [];
        if (imgBase64) content.push({ type:"image_url", image_url:{ url:"data:image/jpeg;base64,"+imgBase64 } });
        content.push({ type:"text", text:userText });
        history.push({ role:"user", content });

        const loadingDiv = addLoadingMessage();

        const messagesWithSystem = [getSystemMessage(), ...history];

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: messagesWithSystem })
            });
            const data = await res.json();
            if (!res.ok || data.error) {
                loadingDiv.textContent = "Error: " + (data.error || "something went wrong");
                return;
            }
            const reply = data.text;
                history.push({ role:"assistant", content:reply });
            addAIMessage(reply, loadingDiv);
            saveChat();
        } catch(err) {
            loadingDiv.textContent = "Error: " + err.message;
        }
    }

    // ── image gen ─────────────────────────────────────────────────────────
    async function generateImage(prompt) {
        const loadingDiv = addLoadingMessage();
        const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
        const img = document.createElement("img");
        img.src = url; img.alt = prompt;
        img.style.maxWidth = "100%"; img.style.borderRadius = "25px";
        img.onload = () => { loadingDiv.innerHTML = ""; loadingDiv.appendChild(img); scrollBottom(); };
        img.onerror = () => { loadingDiv.textContent = "Error generating image."; };
    }

    // ── send ──────────────────────────────────────────────────────────────
async function sendMessage() {
    const text = input.value.trim();

    // allow image-only sends too
    if (!text && !pendingUserImage && !pendingSnapshot) return;
    input.value = "";
    if (responseType === "image") {
        addUserMessage(text);
        generateImage(text);
        return;
    }
    // auto snap if screen sharing
    if (snapOnSend && screenStream && !pendingSnapshot) {
        captureSnapshot();
    }
    await new Promise(r => setTimeout(r, 50));
    const snap = pendingSnapshot;
    const img = pendingUserImage;
    pendingSnapshot = null;
    clearImagePreview();
    hiddenImageInput.value = "";
    updateSnapIndicator();
    addUserMessage(text || "[image]", img || snap);
    await askAI(text || "What's in this image?", img || snap);
}

    input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

// image upload handling
const hiddenImageInput = document.createElement('input');
hiddenImageInput.type = 'file';
hiddenImageInput.accept = 'image/*';
hiddenImageInput.style.display = 'none';
document.body.appendChild(hiddenImageInput);
document.getElementById('image-upload-btn').addEventListener('click', () => hiddenImageInput.click());
hiddenImageInput.addEventListener('change', () => {
    const file = hiddenImageInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        pendingUserImage = base64;
        // show preview similar to screen share
        const imgPreviewBar = document.getElementById('image-preview-bar');
        const imgThumb = document.getElementById('image-thumb');
        if (imgPreviewBar && imgThumb) {
            imgThumb.src = 'data:image/jpeg;base64,' + base64;
            imgPreviewBar.style.display = 'flex';
        }
    };
    reader.readAsDataURL(file);
});

    // ── mode toggle ───────────────────────────────────────────────────────
    function switchResponseType() {
        const btn = document.getElementById("mode-btn");
        const icon = btn.querySelector("i");
        if (responseType === "text") {
            responseType = "image"; icon.className = "ri-ai-generate-text";
            input.placeholder = "Describe your image..."; btn.classList.add("active-btn");
        } else {
            responseType = "text"; icon.className = "ri-image-ai-line";
            input.placeholder = "Ask mochii AI..."; btn.classList.remove("active-btn");
        }
    }

    // ── screenshare ───────────────────────────────────────────────────────
    const shareBtn = document.getElementById("share-btn");
    const previewBar = document.getElementById("screen-preview-bar");
    const screenVideo = document.getElementById("screen-video");
    const snapCanvas = document.getElementById("snap-canvas");
    const screenThumb = document.getElementById("screen-thumb");

    async function toggleScreenShare() {
        if (screenStream) { stopScreenShare(); } else { await startScreenShare(); }
    }

    async function startScreenShare() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor:"always", displaySurface:"monitor" }, audio: false
            });
            screenVideo.srcObject = screenStream;
            screenStream.getVideoTracks()[0].addEventListener("ended", stopScreenShare);
            shareBtn.classList.add("active-btn");
            previewBar.style.display = "flex";
            await new Promise(resolve => {
                if (screenVideo.readyState >= 2) { resolve(); return; }
                screenVideo.addEventListener("canplay", resolve, { once: true });
            });
            thumbInterval = setInterval(updateThumb, 2000);
            updateThumb();
        } catch(err) { console.log("Screen share cancelled:", err.message); }
    }

    function stopScreenShare() {
        if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
        clearInterval(thumbInterval);
        if (autoSnapOn) toggleAutoSnap();
        screenVideo.srcObject = null;
        shareBtn.classList.remove("active-btn");
        previewBar.style.display = "none";
        pendingSnapshot = null;
        updateSnapIndicator();
    }

    function toggleAutoSnap() {
        const btn = document.getElementById("autosnap-btn");
        autoSnapOn = !autoSnapOn;
        if (autoSnapOn) {
            btn.classList.add("active-btn");
            autoSnapInterval = setInterval(() => { if (screenStream) captureSnapshot(); }, 3000);
        } else {
            btn.classList.remove("active-btn");
            clearInterval(autoSnapInterval);
        }
    }

    function drawFrame(canvas, width, height) {
        canvas.width = width || screenVideo.videoWidth;
        canvas.height = height || screenVideo.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
    }

    function updateThumb() {
        if (!screenStream || !screenVideo.videoWidth) return;
        drawFrame(snapCanvas);
        screenThumb.src = snapCanvas.toDataURL("image/jpeg", 0.4);
    }

    function captureSnapshot() {
        if (!screenStream) return;
        const maxW = 1280;
        const scale = Math.min(1, maxW / screenVideo.videoWidth);
        const w = Math.round(screenVideo.videoWidth * scale);
        const h = Math.round(screenVideo.videoHeight * scale);
        drawFrame(snapCanvas, w, h);
        const pixel = snapCanvas.getContext("2d").getImageData(0,0,1,1).data;
        const doCapture = () => {
            pendingSnapshot = snapCanvas.toDataURL("image/jpeg", 0.85).split(",")[1];
            updateSnapIndicator();
        };
        if (pixel[0]===0 && pixel[1]===0 && pixel[2]===0) {
            setTimeout(() => { drawFrame(snapCanvas,w,h); doCapture(); }, 300);
        } else { doCapture(); }
        input.focus();
        input.placeholder = "Ask about your screenshot...";
    }

function updateSnapIndicator() {
    const sendBtn = document.getElementById("send-btn");

    if (pendingSnapshot || pendingUserImage) {
        sendBtn.classList.add("active-btn");
        sendBtn.title = "Send with attachment";
    } else {
        sendBtn.classList.remove("active-btn");
        sendBtn.title = "Send";

        if (responseType === "text") {
            input.placeholder = "Ask mochii AI...";
        }
    }
}

    // ── chat history ──────────────────────────────────────────────────────
    function saveChat() {
        if (history.length === 0) return;
        const chats = JSON.parse(localStorage.getItem("mochii_chats") || "{}");
        const firstMsg = history.find(m => m.role === "user");
        const preview = firstMsg
            ? (Array.isArray(firstMsg.content) ? firstMsg.content.find(c=>c.type==="text")?.text : firstMsg.content) || "chat"
            : "chat";
        chats[currentChatId] = { id: currentChatId, preview: preview.slice(0,40), time: Date.now(), history };
        localStorage.setItem("mochii_chats", JSON.stringify(chats));
        renderHistoryList();
    }

    function renderHistoryList() {
        const chats = JSON.parse(localStorage.getItem("mochii_chats") || "{}");
        const list = document.getElementById("history-list");
        list.innerHTML = "";
        const sorted = Object.values(chats).sort((a,b) => b.time - a.time);
        if (sorted.length === 0) {
            list.innerHTML = '<div class="history-empty">No chat history yet</div>';
            return;
        }
        sorted.forEach(chat => {
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `<div class="hist-preview">${chat.preview}</div><div class="hist-time">${new Date(chat.time).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}</div>`;
            item.onclick = () => loadChat(chat.id);
            list.appendChild(item);
        });
    }

    function loadChat(id) {
        const chats = JSON.parse(localStorage.getItem("mochii_chats") || "{}");
        const chat = chats[id];
        if (!chat) return;
        currentChatId = id;
        history = chat.history;
        messagesContainer.innerHTML = "";
        history.forEach(msg => {
            const stamp = msg.stamp || "";
            if (msg.role === "user") {
                const text = Array.isArray(msg.content) ? msg.content.find(c=>c.type==="text")?.text || "" : msg.content;
                const img = Array.isArray(msg.content) ? msg.content.find(c=>c.type==="image_url")?.image_url?.url?.split(",")[1] : null;
                addUserMessage(text, img);
            } else if (msg.role === "assistant") {
                const div = document.createElement("div");
                div.classList.add("ai-message");
                messagesContainer.appendChild(div);
                renderContent(div, typeof msg.content === "string" ? msg.content : "");
                const actions = document.createElement("div"); actions.className="msg-actions";
                actions.innerHTML=`<button onclick="copyMsg(this)"><i class="ri-clipboard-line"></i> copy</button><button onclick="regenMsg()"><i class="ri-refresh-line"></i> regen</button>`;
                div.insertAdjacentElement("afterend", actions);
            }
        });
        scrollBottom();
        document.getElementById("history-overlay").classList.remove("open");
    }

    function newChat() {
        saveChat();
        currentChatId = Date.now().toString();
        history = [];
        messagesContainer.innerHTML = "";
        document.getElementById("history-overlay").classList.remove("open");
    }

    function toggleSidebar() {
        document.getElementById("history-overlay").classList.toggle("open");
    }

    function handleOverlayClick(e) {
        if (e.target === document.getElementById("history-overlay")) toggleSidebar();
    }

    function clearCurrentChat() {
        if (!confirm("Clear this chat?")) return;
        const chats = JSON.parse(localStorage.getItem("mochii_chats") || "{}");
        delete chats[currentChatId];
        localStorage.setItem("mochii_chats", JSON.stringify(chats));
        history = [];
        messagesContainer.innerHTML = "";
        currentChatId = Date.now().toString();
        renderHistoryList();
    }

    function clearAllChats() {
        if (!confirm("Clear ALL chat history?")) return;
        localStorage.removeItem("mochii_chats");
        history = [];
        messagesContainer.innerHTML = "";
        currentChatId = Date.now().toString();
        renderHistoryList();
    }

    // ── init ──────────────────────────────────────────────────────────────
    const savedMood = localStorage.getItem("mochii_mood") || "casual";
    setMood(savedMood);
    renderHistoryList();
</script>
