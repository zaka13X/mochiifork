    <script>
        const input = document.getElementById("chat-input");
        const messagesContainer = document.getElementById("messages");
        const placeholders = [
            "Ask mochii AI...",
            "What's 2 + 2?",
            "How do I make a steak?",
            "What can you do?",
            "Explain this code...",
            "What's on my screen?",
        ];
        input.placeholder = placeholders[Math.floor(Math.random() * placeholders.length)];

        // ── conversation history ──────────────────────────────────────────
        let history = [];
        let responseType = "text";
        let pendingSnapshot = null; // base64 image to attach to next message
        let screenStream = null;
        let thumbInterval = null;

        // ── render helpers ────────────────────────────────────────────────
        function renderContent(container, markdown) {
            let processed = markdown
                .replace(/\\\[/g, '$$').replace(/\\\]/g, '$$')
                .replace(/\\\(/g, '$').replace(/\\\)/g, '$');
            container.innerHTML = marked.parse(processed);
            container.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
            renderMathInElement(container, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false },
                ],
                throwOnError: false
            });
        }

        function scrollBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addUserMessage(text, imgBase64) {
            const div = document.createElement("div");
            div.classList.add("my-message");
            if (imgBase64) {
                const img = document.createElement("img");
                img.src = "data:image/png;base64," + imgBase64;
                img.classList.add("screenshot-preview");
                div.appendChild(img);
            }
            const p = document.createElement("p");
            p.style.margin = "4px 0 0 0";
            p.textContent = text;
            div.appendChild(p);
            messagesContainer.appendChild(div);
            scrollBottom();
        }

        function addLoadingMessage() {
            const div = document.createElement("div");
            div.classList.add("ai-message");
            div.innerHTML = `<svg viewBox="25 25 50 50" class="loading"><circle r="20" cy="50" cx="50"></circle></svg>`;
            messagesContainer.appendChild(div);
            scrollBottom();
            return div;
        }

        // ── groq call via our proxy ───────────────────────────────────────
        async function askGemini(userText, imgBase64) {
            // build OpenAI-format content for this turn
            const content = [];
            if (imgBase64) {
                content.push({
                    type: "image_url",
                    image_url: { url: "data:image/jpeg;base64," + imgBase64 }
                });
            }
            content.push({ type: "text", text: userText });

            // add to history in OpenAI format
            history.push({ role: "user", content });

            const loadingDiv = addLoadingMessage();

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history })
                });

                const data = await res.json();

                if (!res.ok || data.error) {
                    loadingDiv.textContent = "Error: " + (data.error || "something went wrong");
                    return;
                }

                const reply = data.text;
                history.push({ role: "assistant", content: reply });

                loadingDiv.innerHTML = "";
                renderContent(loadingDiv, reply);
                scrollBottom();

            } catch (err) {
                loadingDiv.textContent = "Error: " + err.message;
            }
        }

        // ── image generation (pollinations, unchanged) ────────────────────
        async function generateImage(prompt) {
            const loadingDiv = addLoadingMessage();
            const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
            const img = document.createElement("img");
            img.src = url;
            img.alt = prompt;
            img.style.maxWidth = "100%";
            img.style.borderRadius = "25px";
            img.onload = () => { loadingDiv.innerHTML = ""; loadingDiv.appendChild(img); scrollBottom(); };
            img.onerror = () => { loadingDiv.textContent = "Error generating image."; };
        }

        // ── send ──────────────────────────────────────────────────────────
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            input.value = "";

            if (responseType === "image") {
                addUserMessage(text);
                generateImage(text);
                return;
            }

            const snap = pendingSnapshot;
            pendingSnapshot = null;
            updateSnapIndicator();

            addUserMessage(text, snap);
            await askGemini(text, snap);
        }

        input.addEventListener("keydown", e => {
            if (e.key === "Enter") sendMessage();
        });

        // ── mode toggle ───────────────────────────────────────────────────
        function switchResponseType() {
            const btn = document.getElementById("mode-btn");
            const icon = btn.querySelector("i");
            if (responseType === "text") {
                responseType = "image";
                icon.className = "ri-ai-generate-text";
                input.placeholder = "Describe your image...";
                btn.classList.add("active-btn");
            } else {
                responseType = "text";
                icon.className = "ri-image-ai-line";
                input.placeholder = "Ask mochii AI...";
                btn.classList.remove("active-btn");
            }
        }

        // ── screenshare ───────────────────────────────────────────────────
        const shareBtn = document.getElementById("share-btn");
        const previewBar = document.getElementById("screen-preview-bar");
        const screenVideo = document.getElementById("screen-video");
        const snapCanvas = document.getElementById("snap-canvas");
        const screenThumb = document.getElementById("screen-thumb");

        async function toggleScreenShare() {
            if (screenStream) {
                stopScreenShare();
            } else {
                await startScreenShare();
            }
        }

        async function startScreenShare() {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always", displaySurface: "monitor" },
                    audio: false
                });
                screenVideo.srcObject = screenStream;

                screenStream.getVideoTracks()[0].addEventListener("ended", stopScreenShare);

                shareBtn.classList.add("active-btn");
                previewBar.style.display = "flex";
                showOverlay();

                // wait for video to have frames before capturing
                await new Promise(resolve => {
                    if (screenVideo.readyState >= 2) { resolve(); return; }
                    screenVideo.addEventListener("canplay", resolve, { once: true });
                });

                // update thumbnail every 2s
                thumbInterval = setInterval(updateThumb, 2000);
                updateThumb();

            } catch (err) {
                console.log("Screen share cancelled or denied:", err.message);
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            clearInterval(thumbInterval);
            screenVideo.srcObject = null;
            shareBtn.classList.remove("active-btn");
            previewBar.style.display = "none";
            hideOverlay();
            if (popupWindow && !popupWindow.closed) { popupWindow.close(); popupWindow = null; }
            pendingSnapshot = null;
            updateSnapIndicator();
        }

        function drawFrame(canvas, width, height) {
            canvas.width = width || screenVideo.videoWidth;
            canvas.height = height || screenVideo.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
        }

        function updateThumb() {
            if (!screenStream || !screenVideo.videoWidth) return;
            drawFrame(snapCanvas);
            screenThumb.src = snapCanvas.toDataURL("image/jpeg", 0.4);
        }

        function captureSnapshot() {
            if (!screenStream) return;
            // scale down to max 1280px wide to keep under Groq's 20MB limit
            const maxW = 1280;
            const scale = Math.min(1, maxW / screenVideo.videoWidth);
            const w = Math.round(screenVideo.videoWidth * scale);
            const h = Math.round(screenVideo.videoHeight * scale);
            drawFrame(snapCanvas, w, h);
            const dataUrl = snapCanvas.toDataURL("image/jpeg", 0.85);
            // check if blank/black
            const testCtx = snapCanvas.getContext("2d");
            const pixel = testCtx.getImageData(0, 0, 1, 1).data;
            if (pixel[0] === 0 && pixel[1] === 0 && pixel[2] === 0) {
                // try again after a short delay
                setTimeout(() => {
                    drawFrame(snapCanvas, w, h);
                    pendingSnapshot = snapCanvas.toDataURL("image/jpeg", 0.85).split(",")[1];
                    updateSnapIndicator();
                }, 300);
            } else {
                pendingSnapshot = dataUrl.split(",")[1];
                updateSnapIndicator();
            }
            input.focus();
            input.placeholder = "Ask about your screenshot...";
        }

        function updateSnapIndicator() {
            const sendBtn = document.getElementById("send-btn");
            if (pendingSnapshot) {
                sendBtn.classList.add("active-btn");
                sendBtn.title = "Send with screenshot";
            } else {
                sendBtn.classList.remove("active-btn");
                sendBtn.title = "Send";
                if (responseType === "text") input.placeholder = "Ask mochii AI...";
            }
        }


        // ── Pop-out chat window ───────────────────────────────────────────
        let pipWindow = null;

        function buildPiPContent(win, doc) {
            doc.open(); doc.write(`<!DOCTYPE html>
<html><head>

            const msgs = doc.getElementById("msgs");
            const inp = doc.getElementById("inp");
            const si = doc.getElementById("si");

            function addMsg(text, isUser, img) {
                const d = doc.createElement("div");
                d.className = isUser ? "mu" : "ma";
                if (img) { const i=doc.createElement("img"); i.src="data:image/jpeg;base64,"+img; d.appendChild(i); }
                const p = doc.createElement("p"); p.style.margin="0"; p.textContent=text; d.appendChild(p);
                msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
            }

            doc.getElementById("snpb").onclick = () => {
                // call captureSnapshot from parent
                win.opener ? win.opener.captureSnapshot() : captureSnapshot();
                si.style.display = "inline-block";
                inp.placeholder = "Ask about screenshot...";
                inp.focus();
            };

            async function send() {
                const text = inp.value.trim(); if (!text) return;
                inp.value = "";
                const snap = pendingSnapshot; pendingSnapshot = null;
                si.style.display = "none"; updateSnapIndicator();
                addMsg(text, true, snap);
                addUserMessage(text, snap);
                const c = [];
                if (snap) c.push({type:"image_url",image_url:{url:"data:image/jpeg;base64,"+snap}});
                c.push({type:"text",text});
                history.push({role:"user",content:c});
                const ld = addMsg("...", false);
                try {
                    const res = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
                    const data = await res.json();
                    const reply = data.text||data.error||"error";
                    history.push({role:"assistant",content:reply});
                    ld.querySelector("p").textContent=reply;
                    msgs.scrollTop=msgs.scrollHeight;
                    const md=addLoadingMessage(); md.innerHTML=""; renderContent(md,reply); scrollBottom();
                } catch(e){ ld.querySelector("p").textContent="Error: "+e.message; }
            }

            doc.getElementById("snd").onclick = send;
            inp.addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
            if (win.addEventListener) win.addEventListener("pagehide", ()=>{ pipWindow=null; });
            if (win.addEventListener) win.addEventListener("unload", ()=>{ pipWindow=null; });
        }

        async function openPiP() {
            if (pipWindow && !pipWindow.closed) { pipWindow.focus(); return; }

            // Try Document Picture-in-Picture (Chrome 116+, no address bar)
            if ('documentPictureInPicture' in window) {
                try {
                    pipWindow = await window.documentPictureInPicture.requestWindow({width:360,height:500});
                    buildPiPContent(pipWindow, pipWindow.document);
                    return;
                } catch(e) {
                    console.warn("Document PiP failed:", e.message);
                }
            }

            // Fallback: small popup window
            const w=360,h=500,left=screen.width-w-20,top=screen.height-h-80;
            pipWindow = window.open("about:blank","mochii_pip",
                `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no,titlebar=no`);
            if (!pipWindow) { alert("Popup blocked! Please allow popups for mochiii.vercel.app"); return; }
            buildPiPContent(pipWindow, pipWindow.document);
        }


        // ── overlay widget ────────────────────────────────────────────────
        const overlayWidget = document.getElementById("overlay-widget");
        const overlayMessages = document.getElementById("overlay-messages");
        const overlayInput = document.getElementById("overlay-input");

        function showOverlay() {
            overlayWidget.style.display = "flex";
        }

        function hideOverlay() {
            overlayWidget.style.display = "none";
        }

        function toggleOverlayMinimize() {
            const btn = document.getElementById("overlay-min-btn").querySelector("i");
            overlayWidget.classList.toggle("minimized");
            btn.className = overlayWidget.classList.contains("minimized") ? "ri-add-line" : "ri-subtract-line";
        }

        function overlaySnap() {
            // snapshot already captured by captureSnapshot(), just show indicator
            overlayInput.placeholder = "Ask about your screenshot...";
            overlayInput.focus();
        }

        function addOverlayMessage(text, isUser) {
            const div = document.createElement("div");
            div.className = isUser ? "ov-user" : "ov-ai";
            div.textContent = text;
            overlayMessages.appendChild(div);
            overlayMessages.scrollTop = overlayMessages.scrollHeight;
        }

        async function overlaySend() {
            const text = overlayInput.value.trim();
            if (!text) return;
            overlayInput.value = "";

            addOverlayMessage(text, true);

            const snap = pendingSnapshot;
            pendingSnapshot = null;
            updateSnapIndicator();

            // also add to main chat
            addUserMessage(text, snap);

            // show loading in overlay
            const loading = document.createElement("div");
            loading.className = "ov-ai";
            loading.textContent = "...";
            overlayMessages.appendChild(loading);
            overlayMessages.scrollTop = overlayMessages.scrollHeight;

            // reuse askGemini logic
            const content = [];
            if (snap) content.push({ type: "image_url", image_url: { url: "data:image/jpeg;base64," + snap } });
            content.push({ type: "text", text });
            history.push({ role: "user", content });

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history })
                });
                const data = await res.json();
                const reply = data.text || data.error || "something went wrong";
                history.push({ role: "assistant", content: reply });
                loading.textContent = reply;
                overlayMessages.scrollTop = overlayMessages.scrollHeight;

                // also render in main chat
                const mainDiv = addLoadingMessage();
                mainDiv.innerHTML = "";
                renderContent(mainDiv, reply);
                scrollBottom();
            } catch (err) {
                loading.textContent = "Error: " + err.message;
            }
        }

        overlayInput.addEventListener("keydown", e => {
            if (e.key === "Enter") overlaySend();
        });

        // ── drag logic ────────────────────────────────────────────────────
        let dragging = false, dragOffX = 0, dragOffY = 0;

        document.getElementById("overlay-header").addEventListener("mousedown", e => {
            if (e.target.closest("button")) return;
            dragging = true;
            const rect = overlayWidget.getBoundingClientRect();
            dragOffX = e.clientX - rect.left;
            dragOffY = e.clientY - rect.top;
            overlayWidget.style.transition = "none";
        });

        document.addEventListener("mousemove", e => {
            if (!dragging) return;
            overlayWidget.style.right = "auto";
            overlayWidget.style.bottom = "auto";
            overlayWidget.style.left = (e.clientX - dragOffX) + "px";
            overlayWidget.style.top = (e.clientY - dragOffY) + "px";
        });

        document.addEventListener("mouseup", () => { dragging = false; });

    </script>
