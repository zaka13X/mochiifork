<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mochii | play</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/x-icon" id="tabIcon">
    <link rel="stylesheet" href="/assets/css/colors.css" id="css-theme-link">
    <link rel="stylesheet" href="/assets/css/elements.css">
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/icons/fonts/remixicon.css">
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="/assets/js/lib/particles.js"></script>
    <script src="/assets/js/colors.js"></script>
    <link rel="stylesheet" href="/assets/css/overlay.css">
</head>

<body style="background: none !important;">

    <style>
        #particles-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.5;
        }

        .container { display: flex; }

        h1 { color: var(--bright-text); font-size: 2.5rem; }

        .hcenter {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        #gameframe {
            width: 95vw;
            height: 80vh;
            background: var(--bg-3);
            border: 1px solid var(--border-4);
            border-radius: 20px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            overflow: hidden;
            display: block;
        }

        .gamecontrols {
            background: var(--bg-2);
            height: 60px;
            width: 95vw;
            position: relative;
            top: -4px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border: 1px solid var(--border-4);
            overflow: hidden;
        }

        .gamestuff {
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            width: fit-content;
        }

        .gamestuff button {
            width: 33.35%;
            border-radius: 0;
            border: 0;
            background: transparent;
            color: white;
            font-size: 25px;
            cursor: pointer;
            text-align: center;
            height: 100%;
            transition: 0.2s;
            margin-right: -2px;
            margin-left: -2px;
        }

        .gamestuff button:hover { background: var(--bg-4); }

        #bottom-tip {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 5px;
            font-size: 14px;
            font-weight: 500;
            font-style: italic;
            opacity: .5;
        }

        .overlay-notice {
            background: var(--bg-5);
            color: var(--text);
            padding: 10px;
            border: 1px solid var(--border-4);
            border-radius: 15px;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: 0.4s;
            z-index: 3298746986;
        }

        /* ── Loading screen ── */
        #game-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 500;
            pointer-events: none;
        }
        #game-loading.hidden { display: none; }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent, #7c3aed);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-label {
            font-size: 14px;
            opacity: 0.6;
            color: var(--bright-text, #fff);
            font-family: sans-serif;
        }

        /* ── Error screen (shown inside the frame area) ── */
        #game-error {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            z-index: 501;
            text-align: center;
            padding: 2rem;
            color: var(--bright-text, #fff);
            font-family: sans-serif;
        }
        #game-error.visible { display: flex; }
        #game-error h2 { font-size: 1.4rem; margin: 0; }
        #game-error p { opacity: 0.55; font-size: 13px; margin: 0; max-width: 340px; }
        .err-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
        .err-btn {
            padding: 8px 18px;
            border-radius: 9px;
            border: none;
            background: var(--accent, #7c3aed);
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.15s;
        }
        .err-btn:hover { opacity: 0.8; }
        .err-btn.secondary {
            background: var(--bg-4, #2a2a3a);
        }
    </style>

    <div id="particles-container"></div>

    <!-- Loading screen -->
    <div id="game-loading">
        <div class="loading-spinner"></div>
        <span id="loading-label">Waiting for proxy...</span>
    </div>

    <!-- Error screen -->
    <div id="game-error">
        <h2>⚠️ Game failed to load</h2>
        <p id="error-detail">The proxy didn't respond in time. This is usually a Wisp server issue.</p>
        <div class="err-actions">
            <button class="err-btn" onclick="retryGame()">↺ Retry</button>
            <button class="err-btn secondary" onclick="switchBackendAndRetry()">Try other backend</button>
            <button class="err-btn secondary" onclick="popoutGame()">Pop out ↗</button>
        </div>
    </div>

    <div class="gamestuff">
        <iframe frameborder="0" id="gameframe" allowfullscreen></iframe>
        <div class="gamecontrols">
            <button onclick="refreshGame()">
                <i class="ri-restart-line"></i>
            </button>
            <button onclick="fullscreenGame()">
                <i class="ri-fullscreen-line"></i>
            </button>
            <button onclick="popoutGame()">
                <i class="ri-external-link-line"></i>
            </button>
        </div>
    </div>

    <div class="overlay-notice">
        Press Alt + G to open the Game Overlay
    </div>

    <div id="gameOverlay" class="">
        <div class="cherri-info">
            <span id="currentTime">Loading time...</span>
            <span class="divider"></span>
            <span id="temperature">Loading temp...</span>
            <span class="divider"></span>
            <span id="sessionTime">Loading session time...</span>
        </div>
        <div class="record-widget">
            <h1>Record</h1>
            <button id="startRecording" style="margin-left: 0;" onclick="startRecording()">
                <i class="ri-record-circle-line"></i>
            </button>
            <button id="stopRecording" disabled style="margin-right: 0;" onclick="stopRecording()">
                <i class="ri-stop-fill"></i>
            </button>
        </div>
        <div class="game-controls">
            <h1>Game Controls</h1>
            <button style="margin-left: 0;"
                onclick="document.getElementById('gameframe').src = document.getElementById('gameframe').src">
                <i class="ri-restart-line"></i>
            </button>
            <button onclick="window.open(document.getElementById('gameframe').src, '_blank')">
                <i class="ri-external-link-line"></i>
            </button>
            <button onclick="downloadGame()" id="downloadBtn">
                <i class="ri-download-line"></i>
            </button>
            <button style="margin-right: 0;" onclick="window.location.href = '/'">
                <i class="ri-door-open-line"></i>
            </button>
        </div>
        <iframe src="/pages/browser-minimum.html" frameborder="0" class="proxy-widget"></iframe>
    </div>

    <p id="bottom-tip">If a game doesn't work, try popping it out!</p>

    <script>
        particlesJS.load('particles-container', '/assets/json/config/particles.json', function () {
            console.log('Particles.js config loaded');
        });
    </script>

    <script>
        // ─────────────────────────────────────────────
        //  Constants & state
        // ─────────────────────────────────────────────
        const LOAD_TIMEOUT_MS = 15000; // how long to wait before showing error
        const SW_WAIT_TIMEOUT_MS = 8000; // how long to wait for SW to become ready

        const gameframe    = document.getElementById('gameframe');
        const loadingEl    = document.getElementById('game-loading');
        const loadingLabel = document.getElementById('loading-label');
        const errorEl      = document.getElementById('game-error');
        const errorDetail  = document.getElementById('error-detail');

        const urlParams = new URLSearchParams(window.location.search);
        const rawGameUrl = urlParams.get('launch');

        // Which backend to try — read from localStorage, same key the settings panel uses
        let currentBackend = localStorage.getItem('cherri_backend') ?? 'uv';

        let loadTimer = null;

        // ─────────────────────────────────────────────
        //  UI helpers
        // ─────────────────────────────────────────────
        function showLoading(msg) {
            errorEl.classList.remove('visible');
            loadingEl.classList.remove('hidden');
            loadingLabel.textContent = msg || 'Loading...';
        }

        function hideLoading() {
            loadingEl.classList.add('hidden');
        }

        function showError(msg) {
            hideLoading();
            clearTimeout(loadTimer);
            errorDetail.textContent = msg || 'Something went wrong.';
            errorEl.classList.add('visible');
        }

        // ─────────────────────────────────────────────
        //  Build the proxied URL for a raw game URL
        // ─────────────────────────────────────────────
        function buildProxiedUrl(rawUrl, backend) {
            backend = backend || currentBackend;

            // Already a local path (e.g. /stores/gn-math/...) — use directly
            if (rawUrl.startsWith('/') && !rawUrl.startsWith('//')) {
                return rawUrl;
            }

            if (backend === 'uv') {
                if (typeof __uv$config === 'undefined') {
                    console.warn('mochii: UV config not loaded, falling back to direct URL');
                    return rawUrl;
                }
                return __uv$config.prefix + __uv$config.encodeUrl(rawUrl);
            }

            if (backend === 'scramjet') {
                // Scramjet uses /scramjet/service/ prefix — adjust if your config differs
                const sjPrefix = '/scramjet/';
                return sjPrefix + encodeURIComponent(rawUrl);
            }

            return rawUrl;
        }

        // ─────────────────────────────────────────────
        //  Wait for BOTH service workers to be active
        //  Resolves as soon as they're ready, rejects after timeout
        // ─────────────────────────────────────────────
        async function waitForServiceWorkers() {
            if (!('serviceWorker' in navigator)) {
                throw new Error('Service workers not supported');
            }

            return new Promise(async (resolve, reject) => {
                const timer = setTimeout(() => {
                    reject(new Error('Service workers did not become ready in time'));
                }, SW_WAIT_TIMEOUT_MS);

                try {
                    // navigator.serviceWorker.ready resolves when a SW controls the page.
                    // We wait for both registrations; if either is already active this is instant.
                    await Promise.all([
                        navigator.serviceWorker.ready,
                        // Re-register in case the page loaded without them (e.g. direct navigation)
                        navigator.serviceWorker.register('/uv/sw.js', { scope: '/' }).catch(() => {}),
                        navigator.serviceWorker.register('/sw.js',    { scope: '/' }).catch(() => {})
                    ]);
                    clearTimeout(timer);
                    resolve();
                } catch (e) {
                    clearTimeout(timer);
                    reject(e);
                }
            });
        }

        // ─────────────────────────────────────────────
        //  Actually load the game into the iframe
        // ─────────────────────────────────────────────
        function loadGame(rawUrl, backend) {
            if (!rawUrl) return;

            clearTimeout(loadTimer);
            errorEl.classList.remove('visible');
            gameframe.src = 'about:blank';

            const proxiedUrl = buildProxiedUrl(rawUrl, backend || currentBackend);
            console.log('mochii: loading game', proxiedUrl, '(backend:', backend || currentBackend, ')');

            showLoading('Loading game...');

            // Timeout — if the frame hasn't fired onload within LOAD_TIMEOUT_MS, show error
            loadTimer = setTimeout(() => {
                showError(
                    'The game took too long to load. Your Wisp server may be blocked or down. ' +
                    'Try switching Wisp servers in Settings, or use "Try other backend".'
                );
            }, LOAD_TIMEOUT_MS);

            gameframe.onload = () => {
                clearTimeout(loadTimer);

                // Check if the frame actually loaded something useful
                let isEmpty = false;
                try {
                    const loc = gameframe.contentWindow?.location?.href;
                    if (!loc || loc === 'about:blank') isEmpty = true;
                } catch (_) {
                    // cross-origin — that's fine, means the proxy is working
                }

                if (isEmpty) {
                    showError('The proxy returned a blank page. Try refreshing or switching backends.');
                    return;
                }

                hideLoading();

                // Inject Alt+G listener into the frame if same-origin
                try {
                    const doc = gameframe.contentDocument;
                    if (doc && doc.head) {
                        const s = doc.createElement('script');
                        s.textContent = `
                            window.addEventListener("keydown", (e) => {
                                if (e.altKey && e.code === "KeyG") {
                                    parent.postMessage({ type: "alt-g" }, "*");
                                }
                            });
                        `;
                        doc.head.appendChild(s);
                    }
                } catch (_) { /* cross-origin, skip */ }
            };

            gameframe.src = proxiedUrl;
            gameframe.focus();
        }

        // ─────────────────────────────────────────────
        //  Entry point — wait for SWs then load
        // ─────────────────────────────────────────────
        async function init() {
            if (!rawGameUrl) {
                showError('No game URL provided.');
                return;
            }

            showLoading('Waiting for proxy...');

            try {
                await waitForServiceWorkers();
                loadingLabel.textContent = 'Starting game...';
            } catch (e) {
                console.warn('mochii: SW wait failed:', e.message, '— attempting to load anyway');
                // Don't block the user — try loading anyway, the error screen will catch failures
            }

            loadGame(rawGameUrl);
        }

        // ─────────────────────────────────────────────
        //  Retry / backend switch
        // ─────────────────────────────────────────────
        function retryGame() {
            loadGame(rawGameUrl);
        }

        function switchBackendAndRetry() {
            const next = currentBackend === 'uv' ? 'scramjet' : 'uv';
            console.log('mochii: switching backend to', next);
            currentBackend = next;
            localStorage.setItem('cherri_backend', next);
            loadGame(rawGameUrl, next);
        }

        // ─────────────────────────────────────────────
        //  Game controls
        // ─────────────────────────────────────────────
        function refreshGame() {
            loadGame(rawGameUrl);
        }

        function fullscreenGame() {
            if (gameframe.requestFullscreen)           gameframe.requestFullscreen();
            else if (gameframe.mozRequestFullScreen)   gameframe.mozRequestFullScreen();
            else if (gameframe.webkitRequestFullscreen) gameframe.webkitRequestFullscreen();
            else if (gameframe.msRequestFullscreen)    gameframe.msRequestFullscreen();
            gameframe.focus();
        }

        function popoutGame() {
            window.open(gameframe.src, '_blank');
        }

        // ─────────────────────────────────────────────
        //  Overlay
        // ─────────────────────────────────────────────
        const useOverlay = localStorage.getItem('cherri_useOverlay') ?? 'yes';
        if (useOverlay === 'yes') initOverlay();

        function initOverlay() {
            const controls       = document.querySelector('.gamecontrols');
            const frame          = document.querySelector('#gameframe');
            const overlay        = document.getElementById('gameOverlay');
            const overlayNotice  = document.querySelector('.overlay-notice');

            controls.style.display = 'none';
            document.querySelector('#bottom-tip').style.display = 'none';
            frame.style.height = '100vh';
            frame.style.width  = '100vw';
            frame.style.border = 'none';
            frame.style.borderRadius = '0';
            frame.style.overflow = 'hidden';

            setTimeout(() => { overlayNotice.style.opacity = 1; }, 500);
            setTimeout(() => { overlayNotice.style.opacity = 0; }, 3000);

            function toggleOverlay() {
                overlay.classList.toggle('active');
            }

            window.addEventListener('message', (ev) => {
                if (ev.data?.type === 'alt-g') toggleOverlay();
            });
            document.addEventListener('keydown', (e) => {
                if (e.altKey && e.key === 'g') toggleOverlay();
            });
        }

        // ─────────────────────────────────────────────
        //  Weather widget
        // ─────────────────────────────────────────────
        async function getTemp() {
            const loc = await fetch('https://ipapi.co/json/').then(r => r.json());
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true`;
            const weather = await fetch(url).then(r => r.json());
            return weather.current_weather.temperature;
        }

        getTemp().then(t => {
            document.getElementById('temperature').textContent = Math.trunc((t * 1.8) + 32) + '°F';
        }).catch(() => {
            document.getElementById('temperature').textContent = '--°F';
        });

        // ─────────────────────────────────────────────
        //  Clock
        // ─────────────────────────────────────────────
        function getOSTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        document.getElementById('currentTime').textContent = getOSTime();
        setInterval(() => {
            document.getElementById('currentTime').textContent = getOSTime();
        }, 60000);

        // ─────────────────────────────────────────────
        //  Session timer
        // ─────────────────────────────────────────────
        const sT = document.getElementById('sessionTime');
        window.addEventListener('DOMContentLoaded', () => {
            let elapsed = 0;
            function format(ms) {
                let s = Math.floor(ms / 1000);
                let h = Math.floor(s / 3600);
                let m = Math.floor((s % 3600) / 60);
                s = s % 60;
                return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
            }
            setInterval(() => { elapsed += 1000; sT.textContent = format(elapsed); }, 1000);
        });

        // ─────────────────────────────────────────────
        //  Recording
        // ─────────────────────────────────────────────
        let recorder;
        let chunks = [];

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
                    audio: true
                });

                document.getElementById('stopRecording').disabled = false;
                document.getElementById('startRecording').style.background = 'var(--accent)';

                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    chunks = [];
                    stream.getTracks().forEach(t => t.stop());
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: 'Cherri_Game_Recording' + Date.now() + '.mp4',
                            types: [{ description: 'Video Files', accept: { 'video/mp4': ['.mp4'] } }]
                        });
                        const writable = await handle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                    } catch (err) {
                        if (err.name !== 'AbortError') console.error('Save failed:', err);
                    }
                };

                recorder.start();
                document.getElementById('stopRecording').disabled = false;
                document.getElementById('startRecording').style.pointerEvents = 'none';
            } catch (err) {
                console.error('Recording error:', err);
            }
        }

        function stopRecording() {
            recorder.stop();
            document.getElementById('stopRecording').disabled = true;
            document.getElementById('startRecording').style.background = 'var(--bg-2)';
            document.getElementById('startRecording').style.pointerEvents = 'auto';
        }

        // ─────────────────────────────────────────────
        //  Download
        // ─────────────────────────────────────────────
        if (!gameframe.src.includes('gn-math')) {
            const dl = document.getElementById('downloadBtn');
            if (dl) dl.style.display = 'none';
        }

        function downloadGame() {
            const src = gameframe.src;
            const a = document.createElement('a');
            a.href = src;
            a.download = src.replace(`${window.location.origin}/stores/gn-math/`, '');
            document.body.append(a);
            a.click();
            a.remove();
        }

        // ─────────────────────────────────────────────
        //  Boot
        // ─────────────────────────────────────────────
        init();
    </script>

    <div id="cursor-thank-you-zxs"
        style="position: fixed; top: 0px; left: 0px; width: 16px; height: 16px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 70%, white 30%); pointer-events: none; z-index: 9999; transform: translate(748px, 592px); transition: width 0.15s, height 0.15s, opacity 0.15s; mix-blend-mode: difference; opacity: 0;">
    </div>
    <script src="/assets/js/cursor.js"></script>
</body>

</html>
