<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mochii ai</title>
    <link rel="stylesheet" href="/assets/css/colors.css">
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/icons/fonts/remixicon.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg, #1a0a1e);
            color: var(--text, #fff);
            font-family: inherit;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: color-mix(in srgb, var(--bg-2, #2a0a2e) 80%, transparent 20%);
            box-shadow: 0 1px 0 rgba(255,255,255,0.07);
            gap: 8px;
            cursor: default;
            -webkit-app-region: drag;
        }

        #header .title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.9;
        }

        #header .title img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }

        #header .btns {
            display: flex;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        #header button {
            background: rgba(255,255,255,0.07);
            border: none;
            color: var(--text, #fff);
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }

        #header button:hover { background: rgba(255,255,255,0.14); }
        #header button.active { 
            background: color-mix(in srgb, var(--accent, #b060e0) 35%, transparent 65%);
            box-shadow: 0 0 0 1px var(--accent, #b060e0);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }

        .msg-user {
            align-self: flex-end;
            background: color-mix(in srgb, var(--accent, #b060e0) 30%, transparent 70%);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent, #b060e0) 40%, transparent 60%);
            padding: 8px 12px;
            border-radius: 14px 14px 4px 14px;
            max-width: 88%;
            word-break: break-word;
        }

        .msg-user img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
        }

        .msg-ai {
            align-self: flex-start;
            background: color-mix(in srgb, var(--bg-2, #2a0a2e) 70%, transparent 30%);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.07);
            padding: 8px 12px;
            border-radius: 14px 14px 14px 4px;
            max-width: 88%;
            word-break: break-word;
            line-height: 1.5;
        }

        .msg-ai p { margin: 4px 0; }
        .msg-ai code { background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 4px; font-size: 0.9em; }

        .loading-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text, #fff);
            animation: blink 1.2s infinite;
            margin: 0 2px;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

        #input-row {
            display: flex;
            gap: 6px;
            padding: 10px 12px;
            background: color-mix(in srgb, var(--bg-2, #2a0a2e) 50%, transparent 50%);
            box-shadow: 0 -1px 0 rgba(255,255,255,0.06);
            align-items: center;
        }

        #chat-input {
            flex: 1;
            background: color-mix(in srgb, var(--bg, #1a0a1e) 80%, transparent 20%);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text, #fff);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            transition: 0.15s;
        }

        #chat-input:focus {
            border-color: color-mix(in srgb, var(--accent, #b060e0) 60%, transparent 40%);
            background: color-mix(in srgb, var(--bg-2, #2a0a2e) 80%, transparent 20%);
        }

        #chat-input::placeholder { color: rgba(255,255,255,0.3); }

        #send-btn {
            background: color-mix(in srgb, var(--accent, #b060e0) 35%, transparent 65%);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }

        #send-btn:hover { background: color-mix(in srgb, var(--accent, #b060e0) 55%, transparent 45%); }

        #snap-indicator {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--accent, #b060e0) 25%, transparent 75%);
            color: var(--text);
            display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="header">
    <div class="title">
        <img src="/assets/img/fav.png" onerror="this.style.display='none'">
        mochii ai
    </div>
    <div class="btns">
        <button id="snap-btn" onclick="requestSnap()" title="Take screenshot"><i class="ri-screenshot-line"></i></button>
    </div>
</div>

<div id="messages"></div>

<div id="input-row">
    <span id="snap-indicator">📷 screenshot</span>
    <input type="text" id="chat-input" placeholder="Ask about your screen...">
    <button id="send-btn" onclick="sendMessage()"><i class="ri-corner-down-left-line"></i></button>
</div>

<canvas id="snap-canvas" style="display:none"></canvas>
<video id="screen-video" style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;" autoplay muted playsinline></video>

<script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("chat-input");
    const snapIndicator = document.getElementById("snap-indicator");
    const snapCanvas = document.getElementById("snap-canvas");
    const screenVideo = document.getElementById("screen-video");

    let history = [];
    let pendingSnapshot = null;
    let screenStream = null;

    // ── auto start screen share on open ──────────────────────────────────
    window.addEventListener("load", async () => {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: "always", displaySurface: "monitor" },
                audio: false
            });
            screenVideo.srcObject = screenStream;
            screenStream.getVideoTracks()[0].addEventListener("ended", () => { screenStream = null; });

            await new Promise(resolve => {
                if (screenVideo.readyState >= 2) { resolve(); return; }
                screenVideo.addEventListener("canplay", resolve, { once: true });
            });

            document.getElementById("snap-btn").classList.add("active");
        } catch(e) {
            addMessage("Screen share denied. You can still chat without it.", false);
        }
    });

    // ── snapshot ──────────────────────────────────────────────────────────
    function requestSnap() {
        if (!screenStream) { alert("No screen share active."); return; }
        const maxW = 1280;
        const scale = Math.min(1, maxW / screenVideo.videoWidth);
        snapCanvas.width = Math.round(screenVideo.videoWidth * scale);
        snapCanvas.height = Math.round(screenVideo.videoHeight * scale);
        const ctx = snapCanvas.getContext("2d");
        ctx.drawImage(screenVideo, 0, 0, snapCanvas.width, snapCanvas.height);

        const check = ctx.getImageData(0, 0, 1, 1).data;
        const capture = () => {
            pendingSnapshot = snapCanvas.toDataURL("image/jpeg", 0.85).split(",")[1];
            snapIndicator.style.display = "inline-block";
            inputEl.placeholder = "Ask about your screenshot...";
            inputEl.focus();
        };

        if (check[0] === 0 && check[1] === 0 && check[2] === 0) {
            setTimeout(() => {
                ctx.drawImage(screenVideo, 0, 0, snapCanvas.width, snapCanvas.height);
                capture();
            }, 300);
        } else {
            capture();
        }
    }

    // ── messages ──────────────────────────────────────────────────────────
    function addMessage(text, isUser, imgBase64) {
        const div = document.createElement("div");
        div.className = isUser ? "msg-user" : "msg-ai";
        if (imgBase64 && isUser) {
            const img = document.createElement("img");
            img.src = "data:image/jpeg;base64," + imgBase64;
            div.appendChild(img);
        }
        if (isUser) {
            const p = document.createElement("p");
            p.textContent = text;
            div.appendChild(p);
        } else {
            div.innerHTML = marked.parse(text);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    function addLoading() {
        const div = document.createElement("div");
        div.className = "msg-ai";
        div.innerHTML = `<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    // ── send ──────────────────────────────────────────────────────────────
    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";

        const snap = pendingSnapshot;
        pendingSnapshot = null;
        snapIndicator.style.display = "none";
        inputEl.placeholder = "Ask about your screen...";

        addMessage(text, true, snap);

        const content = [];
        if (snap) content.push({ type: "image_url", image_url: { url: "data:image/jpeg;base64," + snap } });
        content.push({ type: "text", text });
        history.push({ role: "user", content });

        const loading = addLoading();

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: history })
            });
            const data = await res.json();
            const reply = data.text || data.error || "something went wrong";
            history.push({ role: "assistant", content: reply });
            loading.innerHTML = marked.parse(reply);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        } catch(err) {
            loading.textContent = "Error: " + err.message;
        }
    }

    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
