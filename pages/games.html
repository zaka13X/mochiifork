    <div class="nav-logo">
        <img src="/assets/img/fav.png" alt="" onclick="
            ul.classList.add('active');
            const blurr = document.createElement('div')
            blurr.classList.add('bluroverlay')
            document.body.append(blurr)
            blurr.addEventListener('click', () => {
                ul.classList.remove('active')
                blurr.remove()
            })

    <style>
        #particles-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.5;
        }

        .container {
            display: flex;
        }

        .centerc {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        h1 {
            color: var(--bright-text);
            font-size: 2.5rem;
        }

        .hcenter {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .app {
            width: 280px;
            height: 170px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-4);
            margin: 10px;
            transition: 0.3s;
            border: 0px solid white;
            position: relative;
            z-index: 1;
        }

        .app-img {
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            position: relative;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: 0.3s;
        }

        .title {
            z-index: 31;
            transition: 0.2s;
            position: absolute !important;
            left: 15px;
            bottom: -15px;
            opacity: 0;
        }

        .app:hover {
            cursor: pointer;
            outline-offset: 0px;
            scale: 1.05;
        }

        .app:hover .app-img {
            filter: brightness(0.3);
        }

        .app:hover .title {
            bottom: 5px;
            opacity: 1;
        }

        .app h2 {
            color: var(--bright-text);
            position: relative;
            top: 0%;
            transform: translateY(30%);
            font-size: 20px;
        }

        .apps-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            scrollbar-width: none;
        }

        .bottom-glow {
            content: "";
            position: fixed;
            width: 100%;
            height: 35%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            opacity: 0.3;
            background: radial-gradient(at bottom, var(--bg-3) 30%, transparent 70%);
        }

        .top-glow {
            content: "";
            position: fixed;
            width: 100%;
            height: 35%;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            opacity: 0.3;
            background: radial-gradient(at top, var(--bg-3) 30%, transparent 70%);
        }

        /* --- loading skeleton --- */
        .app-skeleton {
            width: 280px;
            height: 170px;
            border-radius: 15px;
            margin: 10px;
            background: var(--bg-2, #1a1a2e);
            position: relative;
            overflow: hidden;
        }
        .app-skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
            animation: shimmer 1.4s infinite;
        }
        @keyframes shimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* --- error / empty state --- */
        #games-error {
            display: none;
            position: absolute;
            top: 220px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--bright-text, #fff);
            z-index: 10;
        }
        #games-error p { opacity: 0.6; margin-bottom: 12px; }
        #games-error button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent, #7c3aed);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        #games-error button:hover { opacity: 0.85; }

        #lumin-games {
            display: none;
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1180px, calc(100vw - 28px));
            height: calc(100vh - 175px);
            overflow: hidden;
            border-radius: 18px;
            z-index: 1;
        }

        #lumin-games.active {
            display: block;
        }

        #lumin-loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bright-text);
            z-index: 5;
        }

        #lumin-loading.visible {
            display: block;
        }

        body.lumin-store .hcenter input,
        body.lumin-store .apps-container {
            display: none;
        }
    </style>

    <div id="particles-container"></div>
    <div class="hcenter">
        <h1 style="text-align: center;">Games</h1>
        <input style="margin: 3px;" type="text" placeholder="Search for a game..." onkeyup="searchApps(this.value)">
    </div>

    <!-- Error state shown if games fail to load -->
    <div id="games-error">
        <p id="games-error-msg">Failed to load games.</p>
        <button onclick="retryLoad()">↺ Retry</button>
    </div>

    <div id="lumin-loading">loading LuminSDK...</div>
    <div id="lumin-games"></div>

    <div class="apps-container hcenter" style="top: 200px;">
    </div>

    <script>
        particlesJS.load('particles-container', '/assets/json/config/particles.json', function () {
            console.log('Particles.js config loaded');
        });
    </script>

    <script defer>
        const ul = document.getElementById("nav-ul")

        document.querySelectorAll("li a").forEach(link => {
            link.addEventListener("click", function () {
                document.querySelectorAll("li a").forEach(l => l.classList.remove("active"));
                this.classList.add("active");
            });
        });

        window.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "m") {
                e.preventDefault()
                if (!ul.classList.contains("active")) {
                    ul.classList.add("active")
                    const blurr = document.createElement("div")
                    blurr.classList.add("bluroverlay")
                    document.body.append(blurr)
                    blurr.addEventListener("click", () => {
                        blurr.remove()
                        ul.classList.remove("active")
                    })
                } else {
                    ul.classList.remove("active")
                    const blurr = document.querySelector(".bluroverlay")
                    if (blurr) blurr.remove()
                }
            }
        })

        const acont = document.querySelector('.apps-container');
        const errorBox = document.getElementById("games-error");
        const errorMsg = document.getElementById("games-error-msg");
        const luminContainer = document.getElementById("lumin-games");
        const luminLoading = document.getElementById("lumin-loading");
        let selectedStore = localStorage.getItem("cherri_gameStore") || "GN-Math";
        const gameStores = {
            "gn-math": { type: "json", path: "/assets/json/gn-math.json" },
            "game portals": { type: "json", path: "/assets/json/game-portals.json" },
            "featured classics": { type: "json", path: "/assets/json/featured-classics.json" },
            "luminsdk": { type: "lumin" },
        };

        // Show skeleton placeholders while loading
        function showSkeletons(count = 12) {
            acont.innerHTML = "";
            for (let i = 0; i < count; i++) {
                const s = document.createElement("div");
                s.classList.add("app-skeleton");
                acont.appendChild(s);
            }
        }

        function showError(msg) {
            acont.innerHTML = "";
            errorMsg.textContent = msg || "Failed to load games.";
            errorBox.style.display = "block";
        }

        function hideError() {
            errorBox.style.display = "none";
        }

        function setLuminLoading(isLoading) {
            luminLoading.classList.toggle("visible", isLoading);
        }

        function fallbackFromLumin(error) {
            const friendly = window.MochiiLumin?.friendlyError
                ? window.MochiiLumin.friendlyError(error)
                : error;
            const message = friendly?.message || "LuminSDK failed to load.";

            console.warn("mochii: LuminSDK failed, falling back to GN-Math", friendly);
            selectedStore = "GN-Math";
            localStorage.setItem("cherri_gameStore", "GN-Math");
            document.body.classList.remove("lumin-store");
            luminContainer.classList.remove("active");
            setLuminLoading(false);
            showError(`${message} Loading GN-Math instead...`);
            setTimeout(loadLocalGames, 900);
        }

        async function loadLuminGames() {
            document.body.classList.add("lumin-store");
            hideError();
            acont.innerHTML = "";
            luminContainer.classList.add("active");
            setLuminLoading(true);

            try {
                await window.MochiiLumin.init("#lumin-games", {
                    theme: "dark",
                    columns: 8,
                    rows: 4,
                    gamesPerPage: 32,
                    onReady: () => setLuminLoading(false),
                    onError: fallbackFromLumin,
                });
            } catch (error) {
                fallbackFromLumin(error);
            }
        }

        // Fetch JSON with timeout + cache
        async function getJson(path) {
            // Check session cache first
            const cacheKey = "mochii_games_cache_" + path;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                try { return JSON.parse(cached); } catch (_) { /* stale, re-fetch */ }
            }

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);

            try {
                const res = await fetch(path, { signal: controller.signal });
                clearTimeout(timeout);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                sessionStorage.setItem(cacheKey, JSON.stringify(data));
                return data;
            } catch (e) {
                clearTimeout(timeout);
                throw e;
            }
        }

        // Lazy-load background images via IntersectionObserver
        const bgObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    const src = el.dataset.bg;
                    if (src) el.style.background = `url('${src}') center/cover no-repeat`;
                    bgObserver.unobserve(el);
                }
            });
        }, { rootMargin: "200px" });

        async function loadLocalGames(storeConfig) {
            hideError();
            document.body.classList.remove("lumin-store");
            luminContainer.classList.remove("active");
            showSkeletons(12);

            let data;
            const path = storeConfig?.path || "/assets/json/gn-math.json";
            try {
                data = await getJson(path);
            } catch (e) {
                console.error("mochii: failed to load game list", e);
                const isTimeout = e.name === "AbortError";
                showError(isTimeout
                    ? "Game list timed out. Check your connection and retry."
                    : `Failed to load ${selectedStore}. The server may be down.`);
                return;
            }

            if (!Array.isArray(data) || data.length === 0) {
                showError("No games found in this store.");
                return;
            }

            acont.innerHTML = "";

            data.forEach(app => {
                const image = app.img || app.image;
                const appDiv = document.createElement('div');
                appDiv.classList.add('app');

                // Use data-bg for lazy loading instead of inline background
                appDiv.innerHTML = `
                    <div class="app-img" data-bg="${image}"
                        onclick="window.location.href = '/pages/play.html?launch=${encodeURIComponent(app.url)}&name=${encodeURIComponent(app.name)}&img=${encodeURIComponent(image)}'">
                    </div>
                    <div class="title">
                        <h2 class="h2-title">${app.name}</h2>
                    </div>
                `;

                acont.appendChild(appDiv);
                bgObserver.observe(appDiv.querySelector(".app-img"));
            });
        }

        async function loadApps() {
            const storeConfig = gameStores[selectedStore.toLowerCase()] || gameStores["gn-math"];

            if (storeConfig.type === "lumin") {
                loadLuminGames();
                return;
            }

            loadLocalGames(storeConfig);
        }

        function retryLoad() {
            // Clear cache so we actually re-fetch
            Object.keys(sessionStorage)
                .filter(k => k.startsWith("mochii_games_cache_"))
                .forEach(k => sessionStorage.removeItem(k));
            loadApps();
        }

        loadApps();

        function searchApps(q) {
            const apps = document.querySelectorAll('.app');
            apps.forEach(app => {
                const title = app.querySelector('.h2-title');
                if (!title) return;
                app.style.display = title.innerText.toLowerCase().includes(q.toLowerCase())
                    ? 'block' : 'none';
            });
        }
    </script>
</body>

</html>
